#lights out - full local stack.
#
#cp .env.example .env
#docker compose up --build
#
#then open http://localhost:8080
#canvas        -> /
#REST API      -> /api/
#WebSocket     -> /ws/canvas/
#moderation UI -> /admin/  (login from DJANGO_SUPERUSER_* in .env)

name: lights-out

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lightsout}
      POSTGRES_USER: ${POSTGRES_USER:-lightsout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lightsout}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lightsout} -d ${POSTGRES_DB:-lightsout}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lightsout}:${POSTGRES_PASSWORD:-lightsout}@db:5432/${POSTGRES_DB:-lightsout}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "1"
      LOAD_SEED: ${LOAD_SEED:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-moderator}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-lights-out-local}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-moderator@example.com}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  #background jobs: 30-day purge of removed cards and cleanup of
  #rate-limit events (feature 5 retention, feature 1 rate limiting).
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "manage.py", "run_maintenance"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lightsout}:${POSTGRES_PASSWORD:-lightsout}@db:5432/${POSTGRES_DB:-lightsout}
      REDIS_URL: redis://redis:6379/0
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
    volumes:
      - media:/app/media
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pgdata:
  media:

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lightsout
          POSTGRES_USER: lightsout
          POSTGRES_PASSWORD: lightsout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lightsout"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://lightsout:lightsout@localhost:5432/lightsout
      DJANGO_SECRET_KEY: ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test apps -v 2
      - run: python manage.py migrate --noinput && python manage.py bench_viewport --queries 200

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/api/health/ && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: curl -fs http://localhost:8080/ > /dev/null
      - run: docker compose down -v
